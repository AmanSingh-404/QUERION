[project]
name = "querion"
version = "0.0.1"
description = "A 100M-parameter text-to-SQL LLM built from scratch, with its own tokenizer and inference engine"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]