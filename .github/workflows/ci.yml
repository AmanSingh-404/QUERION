name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff pytest tokenizers numpy fastapi httpx
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  smoke:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy tokenizers safetensors huggingface_hub
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m scripts.smoke_eval --min-accuracy 0.9

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build